<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统设置 · DenseAI</title><link rel="stylesheet" href="device.css"></head><body><main><header><a href="index.html">← 返回工作台</a><h1>系统设置</h1></header><nav class="subnav"><a href="device.html">设备管理</a><a class="active" href="settings.html">系统设置</a></nav><section class="grid"><article><h2>时间与区域</h2><label>时区<select id="timezone"><option>UTC</option><option>Asia/Shanghai</option></select></label><label>NTP 开关<input id="ntp" type="checkbox"></label><label>NTP 服务器<input id="ntp-server"></label><button id="save-time">保存时间设置</button></article><article><h2>存储策略</h2><label>自动清理天数<input id="cleanup-days" type="number" min="1"></label><label>保留视频<input id="video-retention" type="checkbox"></label><label>低空间阈值 %<input id="low-space" type="number" min="1" max="90"></label><button id="save-storage">保存存储策略</button></article><article><h2>服务配置</h2><label>API 端口<input id="api-port" type="number" min="1024" max="65535"></label><label>Node-RED 端口<input id="node-red-port" type="number" min="1024" max="65535"></label><button id="save-services">保存服务配置</button><p class="hint">修改端口需要管理员权限并可能导致服务短暂中断。</p></article><article><h2>日志设置</h2><label>日志级别<select id="log-level"><option>INFO</option><option>WARNING</option><option>ERROR</option></select></label><label>保存天数<input id="log-days" type="number" min="1" value="30"></label><p class="hint">日志清理和配置备份请在设备管理页面执行。</p></article></section><p id="result" class="hint"></p></main><script>const api=(new URLSearchParams(location.search).get('api')||`${location.protocol}//${location.hostname}:8080`).replace(/\/$/,'');const $=s=>document.querySelector(s);async function req(path,opt){const r=await fetch(api+path,opt),p=await r.json().catch(()=>({}));if(!r.ok)throw Error(p.error||`HTTP ${r.status}`);return p}function result(t){$('#result').textContent=t}async function load(){const[t,p,s]=await Promise.all(['/api/time','/api/storage-policy','/api/services/config'].map(x=>req(x)));$('#timezone').value=t.timezone;$('#ntp').checked=t.ntp_enabled;$('#ntp-server').value=t.ntp_server;$('#cleanup-days').value=p.auto_cleanup_days;$('#video-retention').checked=p.video_retention_enabled;$('#low-space').value=p.low_space_threshold_percent;$('#api-port').value=s.api_port;$('#node-red-port').value=s.node_red_port}async function save(path,data){try{await req(path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});result('设置已保存')}catch(e){result(e.message)}}$('#save-time').onclick=()=>save('/api/time',{timezone:$('#timezone').value,ntp_enabled:$('#ntp').checked,ntp_server:$('#ntp-server').value});$('#save-storage').onclick=()=>save('/api/storage-policy',{auto_cleanup_days:Number($('#cleanup-days').value),video_retention_enabled:$('#video-retention').checked,low_space_threshold_percent:Number($('#low-space').value)});$('#save-services').onclick=()=>save('/api/services/config',{api_port:Number($('#api-port').value),node_red_port:Number($('#node-red-port').value)});load();</script></body></html>
